name: sbs-portal

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to a published backend image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Neon PostgreSQL connection}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a published frontend image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data: