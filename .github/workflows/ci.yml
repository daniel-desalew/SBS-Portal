name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_SITE_URL: https://www.example.test
      - name: Build production container
        run: docker build -f Dockerfile -t sbs-portal-web:ci --build-arg NEXT_PUBLIC_API_URL=https://api.example.test/api/v1 --build-arg NEXT_PUBLIC_SITE_URL=https://www.example.test .
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - name: Build production container
        run: docker build -f Dockerfile -t sbs-portal-api:ci .
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test